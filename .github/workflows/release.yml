name: Release Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar a release no GitHub'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            platform: linux
            targets: '--linux AppImage deb zip'
          - name: Windows
            os: windows-latest
            platform: win
            targets: '--win nsis portable zip'
          - name: macOS
            os: macos-latest
            platform: mac
            targets: '--mac dmg zip --arm64 --x64'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # npm install (e não npm ci) para funcionar mesmo sem package-lock.json.
      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Build do app web
        run: npm run build

      - name: Dependências do AppImage (libfuse2)
        if: matrix.platform == 'linux'
        run: |
          # O mirror do Ubuntu oscila no runner e derruba o build inteiro.
          # O libfuse so e necessario para EXECUTAR o AppImage gerado, nao
          # para Builds ele, entao a falha nao pode parar a release.
          for attempt in 1 2 3; do
            if sudo apt-get update -o Acquire::Retries=5; then
              break
            fi
            echo "tentativa $attempt de atualizar o apt falhou, repetindo"
            sleep 15
          done
          sudo apt-get install -y --no-install-recommends libfuse2t64 || \
            sudo apt-get install -y --no-install-recommends libfuse2 || \
            sudo apt-get install -y --no-install-recommends libfuse-dev || true
          dpkg -s libfuse2t64 >/dev/null 2>&1 || dpkg -s libfuse2 >/dev/null 2>&1 || \
            echo "aviso: libfuse nao instalado, o AppImage foi gerado mas pode nao rodar neste runner"

      - name: Build do app desktop
        run: npx electron-builder --config electron-builder.yml ${{ matrix.targets }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload dos artefatos
        uses: actions/upload-artifact@v4
        with:
          name: brmusic-${{ matrix.platform }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Baixar artefatos
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Criar release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
